# Generated by: rafter ci init (paths scoped to source; default branch is master)
# Alternative: uses: Raftersecurity/rafter-cli@v1
# No API key required. Lockfile integrity hashes look like AWS keys to the
# pattern engine, so we scan source trees instead of the whole repo root.
name: Rafter Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rafter CLI
        run: npm install -g @rafter-security/cli

      - name: Scan for secrets
        run: |
          rafter secrets src --quiet
          rafter secrets convex --quiet
          rafter secrets scripts --quiet
          rafter secrets .env.example --quiet
          rafter secrets web-prototype/src --quiet
          rafter secrets web-prototype/.env.example --quiet
          rafter secrets web-prototype/firebase-applet-config.json --quiet
